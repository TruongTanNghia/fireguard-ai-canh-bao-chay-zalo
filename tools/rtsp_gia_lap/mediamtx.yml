###############################################################################
# BỘ PHÁT LUỒNG RTSP GIẢ LẬP CAMERA IP - FIREGUARD AI
# Máy chủ: MediaMTX v1.9.3 (https://github.com/bluenviron/mediamtx, giấy phép MIT)
#
# Mỗi đường dẫn camN phát lặp lại một video mẫu trong backend/data/demo_videos,
# giống hệt một camera IP thật. ffmpeg CHỈ chạy khi có người xem / hệ thống AI kết nối
# (runOnDemand), nên khi không dùng thì không tốn CPU.
#
#   rtsp://127.0.0.1:8554/cam2  ->  fire1.mp4
#   rtsp://127.0.0.1:8554/cam3  ->  fire2.mp4
#   rtsp://127.0.0.1:8554/cam4  ->  fire3.mp4
#   rtsp://127.0.0.1:8554/cam5  ->  street_car_fire_ccvt.mp4
#
# Các khóa không khai báo ở đây sẽ dùng giá trị mặc định của MediaMTX.
###############################################################################

logLevel: info

# Chỉ bật RTSP qua TCP. Tắt UDP vì mặc định MediaMTX chiếm cổng UDP 8000/8001.
rtsp: yes
protocols: [tcp]
rtspAddress: :8554
rtpAddress: :18000
rtcpAddress: :18001

# Tắt các giao thức không dùng để tránh chiếm cổng của phần mềm khác
rtmp: no
hls: no
webrtc: no
srt: no
api: no
metrics: no
pprof: no
playback: no

paths:
  cam2:
    runOnDemand: ffmpeg -hide_banner -loglevel error -re -stream_loop -1 -i ../../backend/data/demo_videos/fire1.mp4 -an -c:v copy -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes

  cam3:
    runOnDemand: ffmpeg -hide_banner -loglevel error -re -stream_loop -1 -i ../../backend/data/demo_videos/fire2.mp4 -an -c:v copy -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes

  cam4:
    runOnDemand: ffmpeg -hide_banner -loglevel error -re -stream_loop -1 -i ../../backend/data/demo_videos/fire3.mp4 -an -c:v copy -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes

  cam5:
    runOnDemand: ffmpeg -hide_banner -loglevel error -re -stream_loop -1 -i ../../backend/data/demo_videos/street_car_fire_ccvt.mp4 -an -c:v copy -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes
