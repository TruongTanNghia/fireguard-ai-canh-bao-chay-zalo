<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Luồng xử lý FireGuard AI: camera, YOLOv8s, xác nhận đa khung hình, lưu sự cố, còi báo động và cảnh báo Zalo">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCF6EC"/>
      <stop offset="1" stop-color="#F3E3CC"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0E4A63" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#wbg)"/>

  <text x="600" y="38" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#0E4A63" letter-spacing="2">LUỒNG XỬ LÝ MỘT VỤ CHÁY</text>

  <!-- đường nối -->
  <path id="flow" d="M110 140 H1090" fill="none" stroke="#0E4A63" stroke-opacity="0.25" stroke-width="4" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" values="36;0" dur="1s" repeatCount="indefinite"/>
  </path>
  <circle r="8" fill="#F28C1B">
    <animateMotion dur="5s" repeatCount="indefinite" path="M110 140 H1090"/>
  </circle>
  <circle r="5" fill="#3BB8C3">
    <animateMotion dur="5s" begin="2.5s" repeatCount="indefinite" path="M110 140 H1090"/>
  </circle>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <!-- 1 -->
    <g transform="translate(110 140)">
      <rect x="-82" y="-52" width="164" height="104" rx="16" fill="#FFFFFF" stroke="#1E8FA8" stroke-width="3" filter="url(#sh)"/>
      <text y="-18" font-size="28">📹</text>
      <text y="12" font-size="16" font-weight="800" fill="#0E4A63">Camera</text>
      <text y="34" font-size="12" fill="#1E8FA8">RTSP · Webcam · Video</text>
      <text y="80" font-size="12" font-weight="700" fill="#0E4A63" opacity="0.6">GIAI ĐOẠN 1</text>
    </g>
    <!-- 2 -->
    <g transform="translate(306 140)">
      <rect x="-82" y="-52" width="164" height="104" rx="16" fill="#FFFFFF" stroke="#1E8FA8" stroke-width="3" filter="url(#sh)"/>
      <text y="-18" font-size="28">🧠</text>
      <text y="12" font-size="16" font-weight="800" fill="#0E4A63">YOLOv8s</text>
      <text y="34" font-size="12" fill="#1E8FA8">Nhận diện fire / smoke</text>
      <text y="80" font-size="12" font-weight="700" fill="#0E4A63" opacity="0.6">GIAI ĐOẠN 2</text>
    </g>
    <!-- 3 -->
    <g transform="translate(502 140)">
      <rect x="-82" y="-52" width="164" height="104" rx="16" fill="#FFFFFF" stroke="#1E8FA8" stroke-width="3" filter="url(#sh)"/>
      <text y="-18" font-size="28">✅</text>
      <text y="12" font-size="16" font-weight="800" fill="#0E4A63">Xác nhận</text>
      <text y="34" font-size="12" fill="#1E8FA8">Ngưỡng + nhiều khung</text>
      <text y="80" font-size="12" font-weight="700" fill="#0E4A63" opacity="0.6">GIAI ĐOẠN 3</text>
    </g>
    <!-- 4 -->
    <g transform="translate(698 140)">
      <rect x="-82" y="-52" width="164" height="104" rx="16" fill="#FFFFFF" stroke="#1E8FA8" stroke-width="3" filter="url(#sh)"/>
      <text y="-18" font-size="28">🗂️</text>
      <text y="12" font-size="16" font-weight="800" fill="#0E4A63">Lưu sự cố</text>
      <text y="34" font-size="12" fill="#1E8FA8">Ảnh chụp + CSDL</text>
      <text y="80" font-size="12" font-weight="700" fill="#0E4A63" opacity="0.6">GIAI ĐOẠN 4</text>
    </g>
    <!-- 5 -->
    <g transform="translate(894 140)">
      <rect x="-82" y="-52" width="164" height="104" rx="16" fill="#FFFFFF" stroke="#F28C1B" stroke-width="3" filter="url(#sh)"/>
      <text y="-18" font-size="28">🚨</text>
      <text y="12" font-size="16" font-weight="800" fill="#0E4A63">Báo động</text>
      <text y="34" font-size="12" fill="#F28C1B">Còi hú + WebSocket</text>
      <text y="80" font-size="12" font-weight="700" fill="#0E4A63" opacity="0.6">GIAI ĐOẠN 5</text>
      <rect x="-82" y="-52" width="164" height="104" rx="16" fill="none" stroke="#F28C1B" stroke-width="3">
        <animate attributeName="stroke-opacity" values="0.9;0;0.9" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-width" values="3;12;3" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- 6 -->
    <g transform="translate(1090 140)">
      <rect x="-82" y="-52" width="164" height="104" rx="16" fill="#F28C1B" stroke="#0E4A63" stroke-width="3" filter="url(#sh)"/>
      <text y="-18" font-size="28">📱</text>
      <text y="12" font-size="16" font-weight="800" fill="#FFFFFF">Zalo Bot</text>
      <text y="34" font-size="12" fill="#FFFFFF">Gửi 3 đợt kèm ảnh</text>
      <text y="80" font-size="12" font-weight="700" fill="#0E4A63" opacity="0.6">GIAI ĐOẠN 6</text>
    </g>
  </g>
</svg>
