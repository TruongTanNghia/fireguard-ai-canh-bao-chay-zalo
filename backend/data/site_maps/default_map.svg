<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background & Grid -->
  <rect width="1000" height="600" fill="url(#bgGrad)" rx="12"/>
  <rect width="1000" height="600" fill="url(#grid)" rx="12"/>

  <!-- Tường bao ngoài -->
  <rect x="50" y="50" width="900" height="500" fill="none" stroke="#38bdf8" stroke-width="3" rx="8" stroke-dasharray="12 4"/>

  <!-- Phân khu Xưởng A -->
  <rect x="70" y="70" width="400" height="460" fill="rgba(56, 189, 248, 0.04)" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
  <text x="270" y="110" fill="#94a3b8" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">KHU VỰC XƯỞNG SẢN XUẤT A</text>

  <!-- Phân khu Kho B -->
  <rect x="510" y="70" width="420" height="220" fill="rgba(249, 115, 22, 0.04)" stroke="#f97316" stroke-width="1.5" rx="6"/>
  <text x="720" y="110" fill="#94a3b8" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">KHO VẬT TƯ &amp; NGUYÊN LIỆU B1</text>

  <!-- Phân khu Văn phòng & Trực ban -->
  <rect x="510" y="310" width="420" height="220" fill="rgba(34, 197, 94, 0.04)" stroke="#22c55e" stroke-width="1.5" rx="6"/>
  <text x="720" y="350" fill="#94a3b8" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">TRUNG TÂM ĐIỀU HÀNH &amp; TRỰC BAN</text>

  <!-- Lối đi chính -->
  <path d="M 485 70 L 485 530" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="485" y="305" fill="#64748b" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif" transform="rotate(-90 485 305)">HÀNH LANG TRUNG TÂM</text>

  <!-- Cửa thoát hiểm -->
  <rect x="50" y="270" width="8" height="60" fill="#22c55e" rx="2"/>
  <text x="35" y="305" fill="#22c55e" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif" transform="rotate(-90 35 305)">LỐI THOÁT HIỂM 1</text>

  <rect x="942" y="270" width="8" height="60" fill="#22c55e" rx="2"/>
  <text x="965" y="305" fill="#22c55e" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif" transform="rotate(90 965 305)">LỐI THOÁT HIỂM 2</text>
</svg>
